name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    # Same-repo only: fork PRs never see secrets.ANTHROPIC_KEY (GitHub
    # withholds it), so the run would just fail. Skip cleanly instead of
    # burning a failing run -- fork PRs get maintainer review, not bot
    # review, see CONTRIBUTING.md.
    if: ${{ github.event.pull_request.draft == false && github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        # Pinned to a release commit SHA, not @main -- same reasoning as
        # validate.yml's skills-ref pin: upstream changes can't silently
        # break CI. Bump deliberately (see MAINTAINING.md) by resolving
        # the new tag's commit via:
        #   gh api repos/The-PR-Agent/pr-agent/git/refs/tags/<tag> --jq '.object.sha'
        uses: The-PR-Agent/pr-agent@743f52d80f3513193dfc7626f778c73478df6d0a # v0.41.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-5"
          config.fallback_models: '["anthropic/claude-sonnet-5"]'
          # Only /review runs automatically. This repo already requires a
          # filled-in PR template -- the bot must not overwrite what a
          # contributor wrote, so auto_describe/auto_improve stay off.
          # /describe and /improve are still available as manual PR comments.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
