name: validate skills

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the security scan needs history to find changed skills

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Local layout check
        run: ./validate-skills.sh

      - name: README/skills docs sync check
        run: ./scripts/check-docs-sync.sh

      - name: Content leak/injection scan
        run: python3 scripts/scan-content.py

      - name: Validator fixture tests
        run: ./tests/run-checks-tests.sh

      # skills-ref isn't published to PyPI — install from source, pinned
      # to a commit so upstream changes can't silently break CI.
      - name: Install skills-ref
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"

      - name: Validate every skill
        run: |
          set -e
          for dir in skills/*/; do
            echo "Validating ${dir%/}"
            skills-ref validate "${dir%/}"
          done

      # Static security scan, no model calls. Pinned to a commit so upstream
      # changes cannot silently break CI. Pull requests scan only the skills
      # they changed. Pushes scan every skill. High or critical fails the job.
      - name: Install SkillSpector
        run: |
          pip install "git+https://github.com/NVIDIA/SkillSpector.git@cf5cac7ba5c756a6e0ebf52dc9763f49422f889f"

      - name: Security scan (changed skills on a PR, all skills on a push)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            ./scripts/skillspector-gate.sh "origin/${{ github.base_ref }}"
          else
            ./scripts/skillspector-gate.sh all
          fi
